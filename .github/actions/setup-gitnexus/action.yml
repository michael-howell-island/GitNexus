name: Setup GitNexus
description: Setup Node.js 20, install dependencies, and optionally build

inputs:
  build:
    description: Whether to run npm run build after install
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install workspace dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Build gitnexus-shared
      run: pnpm --filter gitnexus-shared run build
      shell: bash

    - name: Build
      if: ${{ inputs.build == 'true' }}
      run: pnpm --filter gitnexus run build
      shell: bash
